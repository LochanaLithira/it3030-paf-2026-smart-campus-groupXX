# =============================================
#  Smart Campus Resource Management Platform
#  Docker Compose — Backend Only
#  Using Local PostgreSQL Database
# =============================================

services:

  # ── Spring Boot Backend ────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    container_name: smartcampus-backend
    restart: unless-stopped
    environment:
      # Database - Connecting to Local PostgreSQL
      DB_HOST:     ${DB_HOST:-host.docker.internal}
      DB_PORT:     ${DB_PORT:-5432}
      DB_NAME:     ${DB_NAME:-resource_db}
      DB_USER:     ${DB_USER:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-postgres}

      # JWT (leave blank to auto-generate ephemeral key on each restart — DEV only)
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:-}
      JWT_PUBLIC_KEY:  ${JWT_PUBLIC_KEY:-}
      JWT_ACCESS_EXPIRY:  ${JWT_ACCESS_EXPIRY:-900}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}

      # Google OAuth2
      GOOGLE_CLIENT_ID:     ${GOOGLE_CLIENT_ID:-1007617653499-8dcmrlnpk0g6jehdghcgt1oti9b693so.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-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}

      # CORS
      CORS_ORIGINS:   ${CORS_ORIGINS:-http://localhost:5173}
      FRONTEND_URL:   ${FRONTEND_URL:-http://localhost:5173}
      OAUTH2_SUCCESS_REDIRECT: ${OAUTH2_SUCCESS_REDIRECT:-http://localhost:5173/oauth/callback}

      # Spring profile
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-default}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSL http://localhost:8080/api/v1/actuator/health | grep -q UP || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    networks:
      - smartcampus-net

# ── Networks ─────────────────────────────────────────────────────────────────
networks:
  smartcampus-net:
    name: smartcampus-net
    driver: bridge
